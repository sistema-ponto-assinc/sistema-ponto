services:
  activemq:
    image: apache/activemq-classic:6.2.0
    ports:
      - "5672:5672"
      - "8161:8161"
    restart: unless-stopped

  producer:
    build: .
    image: sistema-ponto-producer:latest
    environment:
      BROKER_HOST: activemq
      BROKER_PORT: "5672"
      BROKER_USER: admin
      BROKER_PASSWORD: admin
    ports:
      - "8000:8000"
    depends_on:
      - activemq
    restart: unless-stopped
