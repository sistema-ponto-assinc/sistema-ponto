# Configuração única para todos os ambientes.
# Sem variáveis definidas, os valores padrão (após o ":") são os de DEV (H2 + Flyway).
# Outros ambientes: APP_ENV=qa carrega o .env.qa da raiz do serviço (molde em .env.qa.example).

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: persistenceConsumer

  # Lê as variáveis do .env.<APP_ENV> (opcional: variáveis de ambiente do sistema também funcionam)
  config:
    import: optional:file:.env.${APP_ENV:dev}[.properties]

  # Console web do H2 (http://localhost:8080/h2-console)
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}

  # Configuração de Banco de Dados (JPA/Hibernate)
  datasource:
    url: ${DB_URL:jdbc:h2:mem:ponto_mock_db;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASS:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: validate # Apenas confere as entidades contra o schema (Flyway em DEV, infra/db/init em QA)
    show-sql: ${SHOW_SQL:true}

  # Configuração do Flyway
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${DB_URL:jdbc:h2:mem:ponto_mock_db;DB_CLOSE_DELAY=-1}
    user: ${DB_USER:sa}
    password: ${DB_PASS:}

  # Configuração da Fila (ActiveMQ)
  activemq:
    broker-url: ${ACTIVEMQ_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASS:admin}
    packages:
      trust-all: true # Permite receber JSONs seriazados na fila
