# Infra comum a todos os ambientes: ActiveMQ (AMQP 1.0) + PostgreSQL
# DEV: docker compose --env-file .env.dev up -d
# QA:  docker compose --env-file .env.qa up -d
# O nome do projeto (containers/volumes) segue ENV_NAME, isolando os ambientes.

name: sistema-ponto-${ENV_NAME:?ENV_NAME obrigatoria}

services:
  activemq:
    image: apache/activemq-classic:6.1.4
    container_name: ponto-activemq-${ENV_NAME}
    restart: unless-stopped
    environment:
      ACTIVEMQ_CONNECTION_USER: ${ACTIVEMQ_USER:?ACTIVEMQ_USER obrigatoria}
      ACTIVEMQ_CONNECTION_PASSWORD: ${ACTIVEMQ_PASS:?ACTIVEMQ_PASS obrigatoria}
      ACTIVEMQ_WEB_USER: ${ACTIVEMQ_USER}
      ACTIVEMQ_WEB_PASSWORD: ${ACTIVEMQ_PASS}
    ports:
      # Porta AMQP 1.0 (protocolo oficial dos serviços)
      - "${ACTIVEMQ_AMQP_PORT:?ACTIVEMQ_AMQP_PORT obrigatoria}:5672"
      # Console web do ActiveMQ
      - "${ACTIVEMQ_UI_PORT:?ACTIVEMQ_UI_PORT obrigatoria}:8161"
    volumes:
      - activemq_data:/opt/apache-activemq/data

  postgres:
    image: postgres:16-alpine
    container_name: ponto-postgres-${ENV_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER obrigatoria}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS obrigatoria}
      POSTGRES_DB: ${DB_NAME:?DB_NAME obrigatoria}
    ports:
      - "${DB_PORT:?DB_PORT obrigatoria}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Serviço Java gerado a partir do código do repositório (apps/persistenceConsumer/Dockerfile).
  # Só sobe com --profile app: em DEV o serviço costuma rodar pela IDE.
  persistence-consumer:
    build: ../apps/persistenceConsumer
    image: ponto/persistence-consumer:${ENV_NAME}
    container_name: ponto-persistence-consumer-${ENV_NAME}
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_started
    environment:
      # Dentro do compose, banco e broker são acessados pelo nome do serviço e porta interna
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      ACTIVEMQ_URL: amqp://activemq:5672
      ACTIVEMQ_USER: ${ACTIVEMQ_USER}
      ACTIVEMQ_PASS: ${ACTIVEMQ_PASS}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  activemq_data:
  postgres_data:
